<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>AI Study Assistant - ผู้ช่วยอัจฉริยะของคุณในการเรียนรู้</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Prompt', 'sans-serif'] } } } };
  </script>
  <style>
    body{background:#fff;color:#0f172a;height:100vh;overflow:hidden}
    .btn-gradient{background:linear-gradient(90deg,#00B4DB,#6366F1 55%,#8B5CF6);transition:.2s}
    .btn-gradient:hover{opacity:.9;box-shadow:0 4px 14px rgba(99,102,241,.35)}
    .resizer{width:4px;cursor:col-resize;transition:.2s}
    .resizer:hover,.resizer.dragging{background:#00D2FF}
    .mask-key{-webkit-text-security:disc}
    ::-webkit-scrollbar{width:5px;height:5px}
    ::-webkit-scrollbar-thumb{background:rgba(148,163,184,.35);border-radius:99px}
  </style>
</head>
<body class="antialiased flex selection:bg-cyan-500 selection:text-white">
  <aside id="sidebar" style="width:270px" class="bg-[#161F33] text-white flex flex-col shrink-0 transition-[width] duration-150 overflow-hidden z-20 select-none">
    <div class="h-14 px-3.5 flex items-center justify-between gap-2 shrink-0">
      <a href="#" onclick="resetWorkspace()" class="flex items-center gap-1 text-lg font-bold tracking-tight truncate"><span class="text-[#00D2FF]">AI</span><span>Study Assistant</span></a>
      <div class="flex items-center gap-1 shrink-0">
        <button onclick="toggleSearch()" title="ค้นหาโปรเจ็กต์" class="p-1.5 rounded-lg hover:bg-white/10 text-slate-300 hover:text-white"><i data-lucide="search" class="w-4 h-4"></i></button>
        <button onclick="toggleSidebar()" title="ย่อ/ขยายแถบข้าง" class="p-1.5 rounded-lg hover:bg-white/10 text-slate-300 hover:text-white"><i data-lucide="panel-left" class="w-4 h-4"></i></button>
      </div>
    </div>
    <div id="search-box" class="hidden px-3 pb-2">
      <input id="project-search" oninput="renderProjects()" placeholder="ค้นหาชื่อโปรเจ็กต์..." autocomplete="off" class="w-full rounded-lg bg-[#0B132B] border border-white/10 focus:border-[#00D2FF] px-3 py-1.5 text-xs text-white placeholder-slate-400 outline-none">
    </div>
    <nav class="px-2.5 py-1.5 space-y-1 border-b border-white/10 text-xs font-medium">
      <button onclick="resetWorkspace()" class="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl hover:bg-white/10 text-slate-200 hover:text-white text-left"><i data-lucide="square-pen" class="w-4 h-4 text-[#00D2FF] shrink-0"></i><span>โปรเจ็กต์ใหม่</span></button>
      <button onclick="resetWorkspace()" class="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl hover:bg-white/10 text-slate-200 hover:text-white text-left"><i data-lucide="home" class="w-4 h-4 text-slate-300 shrink-0"></i><span>หน้าแรก</span></button>
      <button onclick="toggleModal()" class="w-full flex items-center justify-between px-3 py-2 rounded-xl hover:bg-white/10 text-slate-200 hover:text-white text-left">
        <span class="flex items-center gap-2.5 truncate"><i data-lucide="key" class="w-4 h-4 text-cyan-300 shrink-0"></i><span>ตั้งค่า API Key</span></span>
        <span id="api-dot" class="w-2.5 h-2.5 rounded-full bg-amber-400 shrink-0"></span>
      </button>
    </nav>
    <div class="px-3.5 pt-3 pb-1.5 flex items-center justify-between gap-2">
      <span class="text-xs font-semibold text-slate-300">โปรเจ็กต์</span>
      <div class="relative">
        <select id="project-filter" onchange="renderProjects()" class="appearance-none bg-white/5 hover:bg-white/10 border border-white/10 rounded-lg pl-2 pr-6 py-1 text-[11px] text-slate-300 outline-none cursor-pointer">
          <option value="all" class="bg-[#161F33]">ทั้งหมด</option>
          <option value="summary" class="bg-[#161F33]">สรุปบทเรียน</option>
          <option value="qa" class="bg-[#161F33]">ถาม AI</option>
          <option value="quiz" class="bg-[#161F33]">สร้างแบบทดสอบ</option>
        </select>
        <i data-lucide="list-filter" class="w-3 h-3 text-slate-400 pointer-events-none absolute right-1.5 top-1/2 -translate-y-1/2"></i>
      </div>
    </div>
    <div id="project-list" class="flex-1 overflow-y-auto px-2.5 py-1 space-y-1"></div>
  </aside>

  <div id="sidebar-resizer" class="resizer bg-slate-200/70 hidden sm:block shrink-0" title="ลากเพื่อปรับความกว้าง"></div>

  <div id="api-modal" class="hidden fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white border border-slate-200 rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl text-slate-800">
      <div class="flex items-center justify-between">
        <h3 class="text-lg font-semibold flex items-center gap-2"><i data-lucide="sparkles" class="w-5 h-5 text-[#00B4DB]"></i> เชื่อมต่อ Gemini API</h3>
        <button onclick="toggleModal()" class="text-slate-400 hover:text-slate-700"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <p class="text-xs text-slate-600 leading-relaxed">นำ <strong>Gemini API Key</strong> (เช่น <code>AIza...</code> หรือ <code>Alzq...</code>) จาก <a href="https://aistudio.google.com/apikey" target="_blank" class="text-sky-600 underline font-medium">Google AI Studio</a> มาวางด้านล่าง</p>
      <input type="text" id="gemini-api-key" name="ai_studio_token_field" autocomplete="off" spellcheck="false" placeholder="วาง API Key ที่นี่..." class="mask-key w-full rounded-xl bg-slate-50 border border-slate-300 focus:border-[#00B4DB] px-3.5 py-2.5 text-sm outline-none">
      <div class="flex justify-between items-center pt-1">
        <button onclick="clearAllData()" class="text-xs text-rose-500 hover:underline">ล้างคีย์และข้อมูลทั้งหมด</button>
        <button onclick="saveKey($('gemini-api-key').value.trim())" class="btn-gradient px-4 py-2 rounded-xl text-xs font-semibold text-white">บันทึก API Key</button>
      </div>
    </div>
  </div>

  <main class="flex-1 bg-white flex flex-col overflow-hidden relative">
    <button id="expand-btn" onclick="toggleSidebar()" class="hidden fixed top-3.5 left-3.5 z-30 p-2 rounded-xl bg-[#161F33] text-white shadow-lg hover:opacity-90"><i data-lucide="panel-left" class="w-4 h-4"></i></button>
    <div id="chat-scroll" class="flex-1 overflow-y-auto px-4 sm:px-8 py-6 flex flex-col">
      <div id="welcome-view" class="my-auto mx-auto max-w-2xl text-center space-y-3 py-8">
        <h1 class="text-2xl sm:text-4xl font-bold tracking-tight text-slate-900">ยินดีต้อนรับสู่ <span class="text-transparent bg-clip-text bg-gradient-to-r from-[#00A8E8] to-[#7C3AED]">AI Study Assistant</span></h1>
        <p class="text-slate-600 text-sm sm:text-base max-w-xl mx-auto">ผู้ช่วยอัจฉริยะของคุณในการเรียนรู้ สรุปบทเรียน ถาม-ตอบข้อสงสัย และสร้างแบบทดสอบอัตโนมัติ</p>
      </div>
      <div id="chat-thread" class="hidden max-w-3xl w-full mx-auto space-y-5 pb-4"></div>
    </div>

    <div class="px-4 sm:px-8 pb-5 pt-2 bg-white shrink-0">
      <div class="max-w-3xl mx-auto bg-slate-100 border border-slate-200 focus-within:border-[#00B4DB] focus-within:bg-white focus-within:shadow-lg rounded-2xl p-2 transition">
        <div id="attachment-bar" class="hidden mb-2 flex items-center justify-between bg-white border border-slate-200 rounded-xl px-3 py-1.5 text-xs">
          <div class="flex items-center gap-2 truncate text-sky-600 font-medium"><i data-lucide="paperclip" class="w-3.5 h-3.5 shrink-0"></i><span id="attachment-name" class="truncate"></span></div>
          <button onclick="clearAttachment()" class="text-slate-400 hover:text-rose-500 ml-2"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <div class="flex items-center gap-2">
          <input type="file" id="file-upload" class="hidden" accept=".pdf,.txt,image/*" onchange="handleFile(event)">
          <button onclick="$('file-upload').click()" title="เพิ่มไฟล์ PDF, TXT หรือรูปภาพ" class="w-10 h-10 rounded-xl bg-white hover:bg-slate-200/70 border border-slate-200 flex items-center justify-center text-slate-600 hover:text-[#00A8E8] shrink-0"><i data-lucide="plus" class="w-5 h-5"></i></button>
          <textarea id="lesson-textarea" rows="1" placeholder="วางเนื้อหาบทเรียน พิมพ์คำถาม หรือแนบไฟล์/รูปภาพที่นี่..." oninput="autoResize(this)" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();processContent()}" class="flex-1 bg-transparent text-sm text-slate-800 placeholder-slate-400 outline-none resize-none max-h-36 py-2.5 px-1 leading-5"></textarea>
          <div class="relative shrink-0">
            <button type="button" onclick="$('mode-menu').classList.toggle('hidden')" class="h-10 px-3 rounded-xl bg-white hover:bg-slate-50 border border-slate-200 text-xs sm:text-sm font-medium text-slate-800 flex items-center gap-2">
              <span id="mode-dot" class="w-2.5 h-2.5 rounded-full bg-[#00D2FF]"></span><span id="mode-label">สรุปบทเรียน</span><i data-lucide="chevron-down" class="w-4 h-4 text-slate-400"></i>
            </button>
            <div id="mode-menu" class="hidden absolute right-0 bottom-12 w-48 bg-white border border-slate-200 rounded-xl shadow-xl py-1.5 z-30 text-xs sm:text-sm text-slate-700">
              <button type="button" onclick="selectMode('summary')" class="w-full px-3.5 py-2 hover:bg-slate-100 flex items-center gap-2.5"><span class="w-2.5 h-2.5 rounded-full bg-[#00D2FF]"></span>สรุปบทเรียน</button>
              <button type="button" onclick="selectMode('qa')" class="w-full px-3.5 py-2 hover:bg-slate-100 flex items-center gap-2.5"><span class="w-2.5 h-2.5 rounded-full bg-teal-400"></span>ถาม AI</button>
              <button type="button" onclick="selectMode('quiz')" class="w-full px-3.5 py-2 hover:bg-slate-100 flex items-center gap-2.5"><span class="w-2.5 h-2.5 rounded-full bg-purple-400"></span>สร้างแบบทดสอบ</button>
            </div>
          </div>
          <button onclick="processContent()" title="ส่งข้อความ" class="btn-gradient w-10 h-10 rounded-xl flex items-center justify-center text-white shrink-0 shadow"><i data-lucide="send" class="w-4 h-4"></i></button>
        </div>
      </div>
    </div>
  </main>

  <script>
    const $ = id => document.getElementById(id);
    const esc = s => String(s).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;' }[m]));
    const KEY_STORE = 'study_ai_key_v2', PROJ_STORE = 'study_ai_projects_v2';
    const MODES = {
      summary: { label: 'สรุปบทเรียน', dot: 'bg-[#00D2FF]', ph: 'วางเนื้อหาบทเรียน หรือกด + เพื่อแนบไฟล์ PDF/รูปภาพที่ต้องการสรุป...' },
      qa: { label: 'ถาม AI', dot: 'bg-teal-400', ph: 'พิมพ์คำถามที่สงสัย หรือถามต่อเนื่องจากคำตอบด้านบนได้เลย...' },
      quiz: { label: 'สร้างแบบทดสอบ', dot: 'bg-purple-400', ph: 'วางเนื้อหาบทเรียน หรือแนบไฟล์เพื่อสร้างข้อสอบพร้อมเฉลย...' }
    };

    // ล้างค่าจากเวอร์ชันเก่าออกทั้งหมดเพื่อไม่ให้คีย์ที่เสียหรือโปรเจ็กต์ค้างเด้งกลับมา
    localStorage.removeItem('gemini_api_key');
    localStorage.removeItem('study_projects');

    let currentMode = 'summary', apiKey = localStorage.getItem(KEY_STORE) || '';
    let projects = JSON.parse(localStorage.getItem(PROJ_STORE) || '[]');
    let activeProjectId = null, attachedFileText = '', attachedImage = null, attachLabel = '', sidebarOpen = true, lastWidth = 270;

    const toggleModal = () => { $('gemini-api-key').value = apiKey; $('api-modal').classList.toggle('hidden'); };
    function saveKey(k, hide = true) {
      apiKey = k.replace(/\s+/g, '');
      $('gemini-api-key').value = apiKey;
      apiKey ? localStorage.setItem(KEY_STORE, apiKey) : localStorage.removeItem(KEY_STORE);
      const d = $('api-dot');
      d.className = `w-2.5 h-2.5 rounded-full shrink-0 ${apiKey ? 'bg-emerald-400 shadow-[0_0_8px_#34d399]' : 'bg-amber-400'}`;
      d.title = apiKey ? 'เชื่อมต่อ AI API พร้อมใช้งานแล้ว' : 'ยังไม่ใส่ API Key';
      if (hide) toggleModal();
    }
    function clearAllData() {
      projects = [];
      localStorage.removeItem(PROJ_STORE);
      saveKey('', true);
      resetWorkspace();
    }
    saveKey(apiKey, false);

    function toggleSidebar() {
      sidebarOpen = !sidebarOpen;
      $('sidebar').style.width = sidebarOpen ? lastWidth + 'px' : '0px';
      $('expand-btn').classList.toggle('hidden', sidebarOpen);
    }
    function toggleSearch() {
      const hidden = $('search-box').classList.toggle('hidden');
      hidden ? ($('project-search').value = '', renderProjects()) : $('project-search').focus();
    }
    $('sidebar-resizer').onmousedown = () => {
      if (!sidebarOpen) return;
      $('sidebar-resizer').classList.add('dragging');
      document.body.style.cursor = 'col-resize';
      const move = e => { lastWidth = Math.min(440, Math.max(200, e.clientX)); $('sidebar').style.width = lastWidth + 'px'; };
      const up = () => { $('sidebar-resizer').classList.remove('dragging'); document.body.style.cursor = ''; removeEventListener('mousemove', move); removeEventListener('mouseup', up); };
      addEventListener('mousemove', move); addEventListener('mouseup', up);
    };

    function renderProjects() {
      const kw = $('project-search').value.trim().toLowerCase(), ft = $('project-filter').value;
      const list = projects.filter(p => (ft === 'all' || p.mode === ft) && (!kw || p.title.toLowerCase().includes(kw)));
      $('project-list').innerHTML = list.length ? list.map(p => `
        <div onclick="loadProject('${p.id}')" class="group flex items-center justify-between gap-2 px-3 py-2 rounded-xl cursor-pointer transition ${p.id === activeProjectId ? 'bg-white/15 text-white' : 'hover:bg-white/10 text-slate-300'}">
          <div class="flex items-center gap-2.5 min-w-0"><span class="w-2.5 h-2.5 rounded-full shrink-0 ${(MODES[p.mode]||MODES.summary).dot}"></span><span class="text-xs font-medium truncate">${esc(p.title)}</span></div>
          <button onclick="deleteProject(event,'${p.id}')" class="opacity-0 group-hover:opacity-100 text-slate-400 hover:text-rose-400 p-0.5"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
        </div>`).join('') : `<div class="text-center text-xs text-slate-400 py-8">ไม่พบโปรเจ็กต์</div>`;
      lucide.createIcons();
    }

    const persistProjects = () => {
      projects.length = Math.min(projects.length, 40);
      projects.length ? localStorage.setItem(PROJ_STORE, JSON.stringify(projects)) : localStorage.removeItem(PROJ_STORE);
      renderProjects();
    };
    function loadProject(id) {
      const p = projects.find(x => x.id === id); if (!p) return;
      activeProjectId = id; selectMode(p.mode);
      $('welcome-view').classList.add('hidden'); $('chat-thread').classList.remove('hidden');
      $('chat-thread').innerHTML = (p.messages || []).map(renderBubble).join('');
      lucide.createIcons(); $('chat-scroll').scrollTop = $('chat-scroll').scrollHeight; renderProjects();
    }
    function deleteProject(e, id) { e.stopPropagation(); projects = projects.filter(x => x.id !== id); persistProjects(); if (activeProjectId === id) resetWorkspace(); }
    function resetWorkspace() {
      activeProjectId = null; $('lesson-textarea').value = ''; autoResize($('lesson-textarea')); clearAttachment();
      $('chat-thread').innerHTML = ''; $('chat-thread').classList.add('hidden'); $('welcome-view').classList.remove('hidden'); renderProjects();
    }
    function selectMode(m) {
      currentMode = m; $('mode-dot').className = `w-2.5 h-2.5 rounded-full ${MODES[m].dot}`;
      $('mode-label').textContent = MODES[m].label; $('lesson-textarea').placeholder = MODES[m].ph; $('mode-menu').classList.add('hidden');
    }
    document.onclick = e => { if (!e.target.closest('#mode-menu') && !e.target.closest('button[onclick*="mode-menu"]')) $('mode-menu').classList.add('hidden'); };

    const autoResize = el => { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 144) + 'px'; };
    const clearAttachment = () => { attachedFileText = ''; attachedImage = null; attachLabel = ''; $('file-upload').value = ''; $('attachment-bar').classList.add('hidden'); };

    async function handleFile(e) {
      const f = e.target.files[0]; if (!f) return;
      clearAttachment(); $('attachment-bar').classList.remove('hidden'); $('attachment-name').textContent = `กำลังโหลด: ${f.name}...`;
      try {
        if (f.type.startsWith('image/')) {
          const r = new FileReader();
          r.onload = () => { attachedImage = { mimeType: f.type, data: r.result.split(',')[1], src: r.result }; attachLabel = f.name; $('attachment-name').textContent = `รูปภาพ: ${f.name}`; };
          r.readAsDataURL(f);
        } else if (f.type === 'application/pdf') {
          const pdf = await pdfjsLib.getDocument({ data: await f.arrayBuffer() }).promise;
          let txt = ''; for (let i = 1; i <= pdf.numPages; i++) txt += (await (await pdf.getPage(i)).getTextContent()).items.map(x => x.str).join(' ') + '\n';
          attachedFileText = txt.trim(); attachLabel = `${f.name} (${attachedFileText.length} ตัวอักษร)`; $('attachment-name').textContent = `ไฟล์ PDF: ${attachLabel}`;
        } else {
          attachedFileText = (await f.text()).trim(); attachLabel = `${f.name} (${attachedFileText.length} ตัวอักษร)`; $('attachment-name').textContent = `ไฟล์ข้อความ: ${attachLabel}`;
        }
      } catch { $('attachment-name').textContent = `ไม่สามารถอ่านไฟล์ ${f.name} ได้`; }
    }

    function renderBubble(msg) {
      const m = MODES[msg.mode] || MODES.summary;
      return msg.role === 'user' ? `
        <div class="flex justify-end"><div class="max-w-[85%] sm:max-w-[75%] rounded-2xl rounded-br-sm bg-slate-100 border border-slate-200 px-4 py-3 text-sm text-slate-800 space-y-2">
          <div class="flex items-center gap-1.5 text-[11px] text-slate-500 font-medium"><span class="w-2 h-2 rounded-full ${m.dot}"></span><span>${m.label}</span></div>
          ${msg.attachment ? `<div class="inline-flex items-center gap-1.5 text-xs bg-white border border-slate-200 rounded-lg px-2.5 py-1 text-sky-600"><i data-lucide="paperclip" class="w-3 h-3"></i> ${esc(msg.attachment)}</div>` : ''}
          ${msg.imgSrc ? `<img src="${msg.imgSrc}" class="max-h-48 rounded-xl border border-slate-200">` : ''}
          ${msg.text ? `<div class="whitespace-pre-wrap leading-relaxed">${esc(msg.text)}</div>` : ''}
        </div></div>` : `
        <div class="flex items-start gap-3">
          <div class="w-8 h-8 rounded-xl btn-gradient flex items-center justify-center shrink-0 mt-0.5 shadow-sm"><i data-lucide="sparkles" class="w-4 h-4 text-white"></i></div>
          <div class="flex-1 min-w-0 bg-slate-50 border border-slate-200/80 rounded-2xl rounded-tl-sm p-4 sm:p-5 space-y-3">
            <div class="flex items-center justify-between border-b border-slate-200 pb-2">
              <span class="text-xs font-semibold text-slate-700 flex items-center gap-1.5"><span class="w-2 h-2 rounded-full ${m.dot}"></span> AI Study Assistant • ${m.label}</span>
              <button onclick="copyBubble(this)" class="text-xs text-slate-500 hover:text-slate-900 flex items-center gap-1"><i data-lucide="copy" class="w-3.5 h-3.5"></i> คัดลอก</button>
            </div>
            <div class="ai-body text-sm text-slate-800 leading-relaxed space-y-2">${msg.html}</div>
          </div>
        </div>`;
    }

    function copyBubble(btn) {
      navigator.clipboard.writeText(btn.closest('.bg-slate-50').querySelector('.ai-body').innerText).then(() => {
        const old = btn.innerHTML; btn.innerHTML = `<i data-lucide="check" class="w-3.5 h-3.5 text-emerald-600"></i> คัดลอกแล้ว`; lucide.createIcons();
        setTimeout(() => { btn.innerHTML = old; lucide.createIcons(); }, 1500);
      });
    }

    async function processContent() {
      const inputTxt = $('lesson-textarea').value.trim(), combined = [inputTxt, attachedFileText].filter(Boolean).join('\n\n');
      if (!combined && !attachedImage) return;
      const mode = currentMode, curImg = attachedImage, curLabel = attachLabel;
      let proj = projects.find(x => x.id === activeProjectId);
      if (!proj) { proj = { id: Date.now().toString(), mode, title: (inputTxt || curLabel || MODES[mode].label).slice(0, 36), messages: [] }; projects.unshift(proj); activeProjectId = proj.id; }

      const userMsg = { role: 'user', mode, text: inputTxt, attachment: curLabel, imgSrc: curImg?.src || '' };
      proj.messages.push(userMsg); persistProjects();
      $('lesson-textarea').value = ''; autoResize($('lesson-textarea')); clearAttachment();
      $('welcome-view').classList.add('hidden');
      const thread = $('chat-thread'); thread.classList.remove('hidden'); thread.insertAdjacentHTML('beforeend', renderBubble(userMsg));

      const tid = 't-' + Date.now();
      thread.insertAdjacentHTML('beforeend', `<div id="${tid}" class="flex items-start gap-3"><div class="w-8 h-8 rounded-xl btn-gradient flex items-center justify-center shrink-0"><i data-lucide="sparkles" class="w-4 h-4 text-white"></i></div><div class="bg-slate-50 border border-slate-200 rounded-2xl rounded-tl-sm px-4 py-3 flex items-center gap-2 text-xs text-slate-600"><span class="w-2 h-2 rounded-full bg-[#00B4DB] animate-bounce"></span><span class="w-2 h-2 rounded-full bg-[#00B4DB] animate-bounce [animation-delay:.15s]"></span><span class="w-2 h-2 rounded-full bg-[#00B4DB] animate-bounce [animation-delay:.3s]"></span><span class="ml-1">AI กำลังคิดคำตอบ...</span></div></div>`);
      lucide.createIcons(); $('chat-scroll').scrollTop = $('chat-scroll').scrollHeight;

      let aiHtml = '';
      if (apiKey) {
        try { aiHtml = await callGemini(mode, combined, curImg, proj.messages); }
        catch (err) { aiHtml = `<div class="p-3 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs mb-2"><strong>ข้อผิดพลาด API:</strong> ${esc(err.message)}</div>${localFallback(mode, combined)}`; }
      } else {
        await new Promise(r => setTimeout(r, 400));
        aiHtml = localFallback(mode, combined || '[รูปภาพที่แนบ]');
      }

      $(tid)?.remove();
      const aiMsg = { role: 'ai', mode, html: aiHtml };
      proj.messages.push(aiMsg); persistProjects();
      thread.insertAdjacentHTML('beforeend', renderBubble(aiMsg));
      lucide.createIcons(); $('chat-scroll').scrollTop = $('chat-scroll').scrollHeight;
    }

    async function callGemini(mode, content, img, history) {
      const prompts = {
        summary: `สรุปใจความสำคัญจากเนื้อหาหรือรูปภาพนี้ให้อ่านเข้าใจง่าย เป็นข้อๆ (Bullet points) ภาษาไทยที่กระชับและชัดเจน:\n\n${content}`,
        qa: `ตอบคำถามหรืออธิบายเนื้อหาจากข้อมูล/รูปภาพนี้อย่างละเอียด เข้าใจง่าย ตรงประเด็น:\n\n${content}`,
        quiz: `สร้างข้อสอบปรนัย 4 ตัวเลือก (ก, ข, ค, ง) จำนวน 3 ข้อ จากเนื้อหาหรือรูปภาพนี้ พร้อมระบุข้อที่ถูกต้องและคำอธิบายเฉลยสั้นๆ:\n\n${content}`
      };

      const contents = [];
      for (const m of history.slice(0, -1)) {
        const role = m.role === 'user' ? 'user' : 'model';
        const text = (m.role === 'user' ? (m.text || m.attachment || 'วิเคราะห์ข้อมูล') : m.html.replace(/<[^>]+>/g, ' ')).trim();
        if (!text) continue;
        contents.at(-1)?.role === role ? (contents.at(-1).parts[0].text += '\n' + text) : contents.push({ role, parts: [{ text }] });
      }
      if (contents[0]?.role !== 'user') contents.shift();

      const parts = [{ text: prompts[mode] }, ...(img ? [{ inline_data: { mime_type: img.mimeType, data: img.data } }] : [])];
      contents.at(-1)?.role === 'user' ? contents.at(-1).parts.push(...parts) : contents.push({ role: 'user', parts });

      let lastErr = '';
      for (const model of ['gemini-2.5-flash', 'gemini-2.0-flash']) {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents })
        });
        if (res.ok) {
          const txt = (await res.json()).candidates?.[0]?.content?.parts?.[0]?.text || 'ไม่ได้รับข้อความตอบกลับจากระบบ';
          return esc(txt).replace(/\*\*(.*?)\*\*/g, '<strong class="text-sky-700 font-semibold">$1</strong>').replace(/\n/g, '<br>');
        }
        lastErr = (await res.json().catch(() => ({}))).error?.message || `HTTP Error ${res.status}`;
      }
      throw new Error(lastErr);
    }

    function localFallback(mode, raw) {
      const sents = raw.split(/[\n\r]+|(?<=[.!?])\s+/).map(s => s.trim()).filter(s => s.length > 5);
      if (mode === 'summary') {
        const pts = sents.length ? sents.slice(0, 5) : [raw];
        return `<p class="text-sky-700 font-semibold">สรุปใจความสำคัญ (${pts.length} ประเด็นหลัก):</p><ul class="list-disc list-inside space-y-1 text-slate-700">${pts.map(p => `<li>${esc(p)}</li>`).join('')}</ul>`;
      }
      return mode === 'qa'
        ? `<p class="text-teal-700 font-semibold">คำถาม: "${esc(raw.slice(0, 120))}"</p><p class="text-slate-700">กรุณาใส่ Gemini API Key ที่เมนู <strong>"ตั้งค่า API Key"</strong> ทางแถบซ้าย</p>`
        : `<p class="text-purple-700 font-semibold">ตัวอย่างข้อสอบเบื้องต้น:</p><p class="text-slate-700 text-xs">ข้อ 1: เนื้อหาหลักที่กล่าวถึงในบทเรียนนี้คือข้อใด? (อ้างอิง: "${esc((sents[0] || raw).slice(0, 100))}...")</p>`;
    }

    renderProjects();
  </script>
</body>
